databases:
  - name: crafts-bappy-db
    databaseName: crafts_bappy
    user: crafts_bappy
    plan: free

services:
  - type: web
    name: crafts-bappy
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn marketplace_project.wsgi:application --workers 1 --threads 4 --timeout 120
    healthCheckPath: /ko/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: crafts-bappy-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
