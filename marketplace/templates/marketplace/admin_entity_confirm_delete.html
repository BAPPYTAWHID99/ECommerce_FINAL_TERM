{% extends "marketplace/admin_workspace_base.html" %}

{% block title %}Delete {{ singular_title }}{% endblock %}

{% block content %}
  <header class="mb-8">
    <p class="mb-2 text-xs font-medium uppercase tracking-[0.2em] text-rose-400">Confirm action</p>
    <h1 class="text-3xl font-semibold tracking-tight sm:text-4xl">Delete {{ singular_title }}</h1>
  </header>

  <form method="post" class="max-w-2xl rounded-2xl border border-rose-500/20 bg-[#1A1A1A] p-5 sm:p-8">
    {% csrf_token %}
    <p class="text-stone-200">Are you sure you want to delete <strong class="text-white">{{ object }}</strong>?</p>
    <p class="mt-3 text-sm text-stone-500">{{ delete_warning }}</p>
    <div class="mt-8 flex flex-wrap gap-3 border-t border-white/[0.06] pt-5">
      <button type="submit" class="rounded-xl bg-rose-500 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-rose-400">Delete {{ singular_title }}</button>
      <a href="{{ list_url }}" class="rounded-xl border border-white/10 px-5 py-2.5 text-sm font-medium text-stone-300 transition hover:bg-white/5">Cancel</a>
    </div>
  </form>
{% endblock %}
